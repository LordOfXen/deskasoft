<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-panel: #111827;
            --border-color: #1f2937;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #ff8a00 0%, #ff384a 100%);
            --brand-glow: rgba(255, 138, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, transparent 70%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 7rem;
            margin: 0;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 20px var(--brand-glow));
        }

        p {
            font-size: 1.1rem;
            margin-top: 10px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        #game-wrapper {
            position: relative;
            background: var(--bg-panel);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255, 138, 0, 0.05);
            margin-bottom: 40px;
            max-width: 90vw;
        }

        canvas {
            background: #0f1423;
            border-radius: 10px;
            display: block;
            max-width: 100%;
        }

        #overlay {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: rgba(11, 15, 25, 0.85);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        #overlay-title {
            font-size: 2rem;
            font-weight: 700;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .overlay-subtext {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .home-btn {
            background: var(--brand-gradient);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(255, 56, 74, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 56, 74, 0.4);
            filter: brightness(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>404</h1>
        <p>The page you're looking for cannot be found.</p>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="700" height="220"></canvas>
        <div id="overlay">
            <span id="overlay-title">System Error: Run</span>
            <span class="overlay-subtext" id="overlay-desc">Press SPACE or Tap to jump</span>
        </div>
    </div>

    <a href="/" class="home-btn">Return to Dashboard</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');

        let player, obstacles, particles, score, gameSpeed, frameId, isPlaying, frameCount;

        function init() {
            player = { x: 60, y: 170, w: 24, h: 24, dy: 0, jumpForce: 8.5, grounded: false };
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 3.5;
            frameCount = 0;
            isPlaying = true;
            overlay.style.display = 'none';
            cancelAnimationFrame(frameId);

            for(let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height - 20),
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }

            gameLoop();
        }

        function jump() {
            if (player.grounded && isPlaying) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            } else if (!isPlaying) {
                init();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
        overlay.addEventListener('click', init);

        function spawnObstacle() {
            let height = 25 + Math.random() * 20; 
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height - 20,
                w: 18,
                h: height
            });
        }

        function gameLoop() {
            if (!isPlaying) return;

            ctx.fillStyle = '#0f1423';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x -= p.speed;
                if (p.x < 0) p.x = canvas.width;
                ctx.fillStyle = `rgba(255, 138, 0, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            player.dy += 0.4; 
            player.y += player.dy;

            if (player.y + player.h >= canvas.height - 20) {
                player.y = canvas.height - 20 - player.h;
                player.dy = 0;
                player.grounded = true;
            }

            ctx.fillStyle = '#ff8a00';
            ctx.shadowColor = '#ff8a00';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(player.x, player.y, player.w, player.h, 4) : ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (frameCount % Math.max(90, 150 - Math.floor(score/5)) === 0) {
                spawnObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                let margin = 3; 
                if (player.x + margin < obs.x + obs.w &&
                    player.x + player.w - margin > obs.x &&
                    player.y + margin < obs.y + obs.h &&
                    player.y + player.h - margin > obs.y) {
                    
                    isPlaying = false;
                    overlayTitle.innerText = "Connection Dropped";
                    overlayDesc.innerHTML = `Packets Transmitted: ${Math.floor(score)}<br><br>Click to reconnect`;
                    overlay.style.display = 'flex';
                }

                ctx.fillStyle = '#ff384a';
                ctx.shadowColor = 'rgba(255, 56, 74, 0.6)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 3) : ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = '600 11px sans-serif';
                ctx.fillText('404', obs.x - 3, obs.y - 8);
            }

            obstacles = obstacles.filter(obs => obs.x + obs.w > 0);

            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#ff8a00';
            ctx.shadowColor = '#ff8a00';
            ctx.shadowBlur = 10;
            ctx.fillRect(0, canvas.height - 20, canvas.width, 2);
            ctx.shadowBlur = 0;

            score += 0.05;
            if (Math.floor(score) % 50 === 0 && score > 0) {
                gameSpeed += 0.005;
            }

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 14px -apple-system, sans-serif';
            ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 30);

            frameCount++;
            if (isPlaying) {
                frameId = requestAnimationFrame(gameLoop);
            }
        }
        
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
        ctx.fillStyle = '#ff8a00';
        ctx.fillRect(0, canvas.height - 20, canvas.width, 2);
        
        ctx.shadowColor = '#ff8a00';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(60, canvas.height - 20 - 24, 24, 24, 4) : ctx.fillRect(60, canvas.height - 20 - 24, 24, 24);
        ctx.fill();
    </script>
</body>
</html>
