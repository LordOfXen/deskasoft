<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/core-img/favicon.png">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-panel: #111827;
            --border-color: #1f2937;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-gradient: linear-gradient(135deg, #ff8a00 0%, #ff384a 100%);
            --brand-glow: rgba(255, 138, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 40px 0 0 0;
            box-sizing: border-box;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, transparent 70%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto; 
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out;
            padding: 0 15px;
        }

        h1 {
            font-size: 7rem;
            margin: 0;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -2px;
            filter: drop-shadow(0 0 20px var(--brand-glow));
        }

        p {
            font-size: 1.1rem;
            margin-top: 10px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        #game-wrapper {
            position: relative;
            background: var(--bg-panel);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255, 138, 0, 0.05);
            margin-bottom: 40px;
            max-width: 95vw;
        }

        canvas {
            background: #0f1423;
            border-radius: 10px;
            display: block;
            max-width: 100%;
            height: auto;
        }

        #overlay {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            background: rgba(11, 15, 25, 0.85);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        #overlay-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-align: center;
            padding: 0 10px;
        }

        .overlay-subtext {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
            text-align: center;
            line-height: 1.4;
        }

        .home-btn {
            background: var(--brand-gradient);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(255, 56, 74, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 56, 74, 0.4);
            filter: brightness(1.1);
        }

        .footer {
            position: relative;
            margin-top: auto;   
            padding: 40px 15px 20px 15px; 
            width: 100%;
            box-sizing: border-box;
            font-size: 0.75rem;
            color: #64748b; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.6;
            pointer-events: none; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 5rem; }
            .footer { 
                font-size: 0.6rem;
                letter-spacing: 1px;
            }
            #overlay-title { font-size: 1.8rem; }
            .overlay-subtext { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>404</h1>
        <p>The page you're looking for cannot be found.</p>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="280"></canvas>
        <div id="overlay">
            <span id="overlay-title">System Error: Run</span>
            <span class="overlay-subtext" id="overlay-desc">Press SPACE or Tap to jump</span>
        </div>
    </div>

    <a href="/" class="home-btn">Return to Home</a>

    <div class="footer">
        © 2026 DESKASOFT INTERNATIONAL. ALL RIGHTS RESERVED.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');

        let player, obstacles, particles, score, gameSpeed, frameId, isPlaying, frameCount;

        const groundHeight = 26; 

        function init() {
            player = { x: 80, y: canvas.height - groundHeight - 32, w: 32, h: 32, dy: 0, jumpForce: 10.5, grounded: false };
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 4.2;
            frameCount = 0;
            isPlaying = true;
            overlay.style.display = 'none';
            cancelAnimationFrame(frameId);
            
            for(let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height - groundHeight),
                    size: Math.random() * 2.5 + 0.5,
                    speed: Math.random() * 0.6 + 0.1,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }

            gameLoop();
        }

        function jump() {
            if (player.grounded && isPlaying) {
                player.dy = -player.jumpForce;
                player.grounded = false;
            } else if (!isPlaying) {
                init();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('mousedown', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, {passive: false});
        overlay.addEventListener('click', init);

        function spawnObstacle() {
            let height = 35 + Math.random() * 25; 
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height - groundHeight,
                w: 24,
                h: height
            });
        }

        function gameLoop() {
            if (!isPlaying) return;

            ctx.fillStyle = '#0f1423';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x -= p.speed;
                if (p.x < 0) p.x = canvas.width;
                ctx.fillStyle = `rgba(255, 138, 0, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            player.dy += 0.5; 
            player.y += player.dy;

            if (player.y + player.h >= canvas.height - groundHeight) {
                player.y = canvas.height - groundHeight - player.h;
                player.dy = 0;
                player.grounded = true;
            }

            ctx.fillStyle = '#ff8a00';
            ctx.shadowColor = '#ff8a00';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(player.x, player.y, player.w, player.h, 6) : ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (frameCount % Math.max(80, 130 - Math.floor(score/5)) === 0) {
                spawnObstacle();
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                let margin = 4; 
                if (player.x + margin < obs.x + obs.w &&
                    player.x + player.w - margin > obs.x &&
                    player.y + margin < obs.y + obs.h &&
                    player.y + player.h - margin > obs.y) {
                    
                    isPlaying = false;
                    overlayTitle.innerText = "Connection Dropped";
                    overlayDesc.innerHTML = `Packets Transmitted: ${Math.floor(score)}<br><br>Tap to reconnect`;
                    overlay.style.display = 'flex';
                }

                ctx.fillStyle = '#ff384a';
                ctx.shadowColor = 'rgba(255, 56, 74, 0.6)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 4) : ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.font = '700 14px sans-serif';
                ctx.fillText('404', obs.x - 2, obs.y - 10);
            }

            obstacles = obstacles.filter(obs => obs.x + obs.w > 0);

            ctx.fillStyle = '#1f2937';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            ctx.fillStyle = '#ff8a00';
            ctx.shadowColor = '#ff8a00';
            ctx.shadowBlur = 12;
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 3);
            ctx.shadowBlur = 0;

            score += 0.05; 
            if (Math.floor(score) % 50 === 0 && score > 0) {
                gameSpeed += 0.006; 
            }

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 18px -apple-system, sans-serif';
            ctx.fillText(`SCORE: ${Math.floor(score)}`, 25, 35);

            frameCount++;
            if (isPlaying) {
                frameId = requestAnimationFrame(gameLoop);
            }
        }

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
        ctx.fillStyle = '#ff8a00';
        ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 3);
        
        ctx.shadowColor = '#ff8a00';
        ctx.shadowBlur = 18;
        ctx.beginPath();

        ctx.roundRect ? ctx.roundRect(80, canvas.height - groundHeight - 32, 32, 32, 6) : ctx.fillRect(80, canvas.height - groundHeight - 32, 32, 32);
        ctx.fill();
    </script>
</body>
</html>
